server:
  port: 8082

spring:
  application:
    name: catalogo-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalogo_db}
    username: ${DB_USERNAME:delivery}
    password: ${DB_PASSWORD:admin}
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    open-in-view: false

internal:
  api-key: ${INTERNAL_API_KEY:internal-super-key-2024}
